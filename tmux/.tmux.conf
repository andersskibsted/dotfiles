# --- Prefix ---
unbind C-b
set -g prefix C-n
bind C-n send-prefix

# --- Generelt ---
set -g mouse on                    # scroll, klik for at vælge pane, resize med mus
set -g base-index 1                # vinduer/paneler nummereres fra 1, ikke 0
setw -g pane-base-index 1
set -g renumber-windows on         # omnummerer vinduer når et lukkes
set -g history-limit 10000         # mere scrollback
set -g escape-time 0               # ingen forsinkelse ved Esc (vigtigt for vim/Emacs)
set -g focus-events on             # nødvendigt for auto-reload i visse editorer

# --- Farver (til Ghostty) ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Split-genveje (mere intuitive end standard) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Ny pane/vindue åbner i samme mappe som nuværende ---
bind c new-window -c "#{pane_current_path}"

# --- Navigation mellem panes med vim-taster ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Genindlæs config uden at genstarte tmux ---
bind r source-file ~/.tmux.conf \; display "Config genindlæst!"

# --- Statusbar (simpel og informativ) ---
set -g status-position top
set -g status-style bg=default
set -g window-status-current-style bold
